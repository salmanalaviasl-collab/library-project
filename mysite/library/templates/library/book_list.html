<!DOCTYPE html>
<html>
<head>
    <title>Book List</title>
</head>
<body>
    <h1>List of Books</h1>
    <ul>
        {% for book in books %}
            <li>
                {{ book.title }} - {{ book.author }}
                <a href="{% url 'delete_book' book.id %}">delete</a>
                <a href="{% url 'edit_book' book.id %}">edit</a>
            </li>
        {% endfor %}
    </ul>
    <a href="{% url 'add_book' %}">add new book </a>
</body>
</html>
