{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Book List</title>
    <link rel="stylesheet" href="{% static 'library/style.css' %}">
</head>
<body>
    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
    <h1>List of Books</h1>
    <ul>
        {% for book in books %}
            <li>
                <a href="{% url 'book_detail' book.id %}">{{book.title}}</a>
                {{ book.author }} - {{ book.available_copies }}
                <br>
                <a href="{% url 'delete_book' book.id %}"class="btn btn-delete">Delete</a>
                <a href="{% url 'edit_book' book.id %}"class="btn btn-edit">Edit</a>
                <a href="{% url 'loan_book' book.id %}"class="btn btn-loan">Loan</a>
            </li>

        {% endfor %}
    </ul>
    <a href="{% url 'add_book' %}" class="btn btn-nav">Add New Book</a>
    <a href="{% url 'member_list' %}" class="btn btn-nav">Member List</a>
</body>
</html>
