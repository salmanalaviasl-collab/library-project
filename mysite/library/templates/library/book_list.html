<!DOCTYPE html>
<html>
<head>
    <title>Book List</title>
</head>
<body>
    <h1>List of Books</h1>
    <ul>
        {% for book in books %}
            <li>
                {{ book.title }} - {{ book.author }}
                <a href="{% url 'delete_book' book.id %}">حذف</a>
            </li>

        {% endfor %}
    </ul>
</body>
</html>
