<!DOCTYPE html>
<html>
<head>
    <title>Book List</title>
</head>
<body>
    <h1>List of Books</h1>
    <ul>
        {% for book in books %}
            <li>
                <a href="{% url 'book_detail' book.id %}">{{book.title}}</a>
                {{ book.author }} - {{ book.available_copies }}
                <br><a href="{% url 'delete_book' book.id %}">Delete</a>
                <br><a href="{% url 'edit_book' book.id %}">Edit</a>
                <br><a href="{% url 'loan_book' book.id %}">Loan</a>
            </li>

        {% endfor %}
    </ul>
    <br><a href="{% url 'add_book' %}">add new book </a>
</body>
</html>
