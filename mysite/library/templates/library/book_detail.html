<!DOCTYPE html>
<html>
<head>
<body>
    <h1>{{ book.title }}</h1>
    <p>Author🧑🏻‍🏫: {{ book.author }}</p>
    <p>Available🕵🏻‍♂️: {{ book.available_copies }}</p>
    <h2>loans for this book</h2>
    <ul>
        {% for loan in loans %}
        <li>{{ loan.member.name }} - {{ loan.borrow_date }}</li>
        {% endfor %}
    </ul>

</body>
</head>
</html>
